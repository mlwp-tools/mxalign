[project]
name = "mxalign"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michiel Van Ginderachter", email = "michiel.vanginderachter@meteo.be" }
]
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "dask>=2026.1.2",
    "earthkit-data>=0.19.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.15.1",
    "netcdf4>=1.7.4",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "xarray>=2026.1.0",
    "zarr<3.0",
    "bokeh>=3.8.2",
    "distributed>=2026.1.2",
]

[project.scripts]
mxalign = "mxalign.cli:main"

[project.optional-dependencies]
earthkit = [
    "earthkit-meteo>=0.6.1",
]
ifs = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.45.0",
    "eccodeslib>=2.46.2.19",
]
verification = [
    "xskillscore>=0.0.29",
]
jobqueue = [
    "dask-jobqueue>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
