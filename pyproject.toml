[project]
name = "mxalign"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michiel Van Ginderachter", email = "michiel.vanginderachter@meteo.be" }
]
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "dask>=2026.1.2",
    "h5netcdf>=1.8.1",
    "h5py<3.15",
    "mlwp-data-loaders",
    "netcdf4>=1.7.4",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "xarray>=2026.1.0",
    "zarr<3.0",
    "bokeh>=3.8.2",
    "distributed>=2026.1.2",
    "mlwp-data-specs",
    "mlwp-data-loaders",
    "pandas>=2.2",
    "pydantic>=2",
]

[project.scripts]
mxalign = "mxalign.pipeline.cli:main"

[project.optional-dependencies]
earthkit = [
    "earthkit-meteo>=0.6.1",
]
ifs = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.45.0",
    "eccodeslib>=2.46.2.19",
]
verification = [
    "xskillscore>=0.0.29",
]
jobqueue = [
    "dask-jobqueue>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# ANN: type annotations on all arguments and return values; D: docstrings
extend-select = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Orphaned loader that imports removed modules; pending removal or port to mlwp-data-loaders
"src/mxalign/loaders/ifs_forecast.py" = ["ANN", "D"]

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",  # no "Examples" section required
    "SA01",  # no "See Also" section required
    "ES01",  # no "Extended Summary" section required
]
# __init__ parameters are documented in the class docstring (numpydoc convention)
exclude = ['\.__init__$']
exclude_files = ['src/mxalign/loaders/ifs_forecast\.py']

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
mlwp-data-specs = { git = "https://github.com/mlwp-tools/mlwp-data-specs", rev = "059f382" }
mlwp-data-loaders = { git = "https://github.com/mlwp-tools/mlwp-data-loaders" }
